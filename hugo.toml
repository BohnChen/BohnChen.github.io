baseURL = 'https://BohnChen.github.io/'
locale = 'zh-cn'
title = "Bohn's Blog"
theme = 'PaperMod'

[params]
  showReadingTime = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowToc = true

  [params.homeInfoParams]
    Title = "你好 👋"
    Content = "Bohn 的技术博客"

[outputs]
  home = ['HTML', 'RSS', 'JSON']

[taxonomies]
  category = 'categories'
  tag = 'tags'

[menu]
  [[menu.main]]
    name = '归档'
    url = '/archives/'
    weight = 10
  [[menu.main]]
    name = '分类'
    url = '/categories/'
    weight = 20
  [[menu.main]]
    name = '标签'
    url = '/tags/'
    weight = 30
