<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bgToken" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="priceLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="neonGlow">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="1000" height="520" fill="url(#bgToken)" rx="12" />

  <!-- Title & Subtitle -->
  <text x="60" y="48" fill="#f8fafc" font-size="22" font-weight="bold" font-family="-apple-system, BlinkMacSystemFont, sans-serif">大模型推理成本断崖式下跌趋势 (对数坐标)</text>
  <text x="60" y="75" fill="#94a3b8" font-size="13" font-family="-apple-system, BlinkMacSystemFont, sans-serif">单位算力/Token 成本呈现超越摩尔定律的指数暴跌，席卷生产力所有角落</text>

  <!-- Plot Area -->
  <g transform="translate(100, 100)">
    <!-- Y-Axis Log Scale Grid Lines -->
    <g stroke="#334155" stroke-opacity="0.35" stroke-width="1" stroke-dasharray="4,4">
      <line x1="0" y1="40" x2="820" y2="40" />
      <line x1="0" y1="120" x2="820" y2="120" />
      <line x1="0" y1="200" x2="820" y2="200" />
      <line x1="0" y1="280" x2="820" y2="280" />
    </g>

    <!-- Y labels -->
    <text x="-15" y="45" fill="#94a3b8" font-size="12" font-family="monospace" text-anchor="end">$60.00 / 1M Tokens (GPT-4 初始定价)</text>
    <text x="-15" y="125" fill="#94a3b8" font-size="12" font-family="monospace" text-anchor="end">$10.00 / 1M Tokens (主流顶模)</text>
    <text x="-15" y="205" fill="#94a3b8" font-size="12" font-family="monospace" text-anchor="end">$1.00 / 1M Tokens (轻量/高性价比)</text>
    <text x="-15" y="285" fill="#10b981" font-size="12" font-family="monospace" text-anchor="end">&lt; $0.15 / 1M Tokens (极致开源/蒸馏模型)</text>

    <!-- X Axis -->
    <line x1="0" y1="320" x2="820" y2="320" stroke="#475569" stroke-width="1.5" />

    <!-- Plummeting Curve: (2023.03) $60 -> (2023.11) $20 -> (2024.05) $5 -> (2024.09) $2.5 -> (2025/2026 DeepSeek V3/R1) $0.14 -->
    <!-- Points: 
         x=40 (2023.03): y=40 ($60)
         x=220 (2023.11): y=95 ($20)
         x=420 (2024.05): y=155 ($5)
         x=600 (2024.09): y=190 ($2.5)
         x=760 (2025-2026): y=285 (~$0.14)
    -->
    <path d="M 40 40 
             C 120 45, 180 85, 220 95
             C 290 115, 360 145, 420 155
             C 500 170, 550 182, 600 190
             C 660 200, 710 270, 770 285"
          fill="none" stroke="url(#priceLine)" stroke-width="4.5" filter="url(#neonGlow)" stroke-linecap="round"/>

    <!-- Point Markers -->
    <!-- 2023.03 GPT-4 -->
    <circle cx="40" cy="40" r="6" fill="#f43f5e" stroke="#fff" stroke-width="1.5" />
    <text x="40" y="345" fill="#94a3b8" font-size="11" font-family="monospace" text-anchor="middle">2023.03</text>
    <rect x="50" y="25" width="135" height="30" rx="5" fill="#1e293b" stroke="#f43f5e" stroke-width="1" />
    <text x="58" y="45" fill="#fda4af" font-size="11" font-family="sans-serif">GPT-4 ($60/1M)</text>

    <!-- 2023.11 GPT-4 Turbo -->
    <circle cx="220" cy="95" r="5" fill="#fb7185" />
    <text x="220" y="345" fill="#94a3b8" font-size="11" font-family="monospace" text-anchor="middle">2023.11</text>
    <text x="220" y="80" fill="#cbd5e1" font-size="11" font-family="sans-serif" text-anchor="middle">GPT-4 Turbo 降价 3x</text>

    <!-- 2024.05 GPT-4o -->
    <circle cx="420" cy="155" r="5" fill="#facc15" />
    <text x="420" y="345" fill="#94a3b8" font-size="11" font-family="monospace" text-anchor="middle">2024.05</text>
    <text x="420" y="140" fill="#fef08a" font-size="11" font-family="sans-serif" text-anchor="middle">GPT-4o 降价 50%</text>

    <!-- 2024.09 Claude 3.5 / Gemini 1.5 Flash -->
    <circle cx="600" cy="190" r="5" fill="#34d399" />
    <text x="600" y="345" fill="#94a3b8" font-size="11" font-family="monospace" text-anchor="middle">2024.09</text>
    <text x="600" y="175" fill="#a7f3d0" font-size="11" font-family="sans-serif" text-anchor="middle">Flash / 轻量化普及</text>

    <!-- 2025/2026 DeepSeek V3 & R1 -->
    <circle cx="770" cy="285" r="7" fill="#10b981" stroke="#fff" stroke-width="2" filter="url(#neonGlow)" />
    <text x="770" y="345" fill="#6ee7b7" font-size="11" font-weight="bold" font-family="monospace" text-anchor="middle">2025-2026</text>
    <rect x="660" y="235" width="160" height="36" rx="6" fill="#064e3b" stroke="#34d399" stroke-width="1.5" />
    <text x="740" y="252" fill="#ecfdf5" font-size="12" font-weight="bold" font-family="sans-serif" text-anchor="middle">DeepSeek-V3 / R1</text>
    <text x="740" y="266" fill="#a7f3d0" font-size="10" font-family="monospace" text-anchor="middle">降幅超 99% ($0.14/1M)</text>

    <!-- Bottom summary tag -->
    <g transform="translate(180, 375)">
      <rect x="0" y="0" width="460" height="30" rx="15" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="230" y="20" fill="#38bdf8" font-size="12" font-weight="bold" font-family="sans-serif" text-anchor="middle">
        💡 两年暴跌逾 400 倍：算力从奢侈品变为像水与电一样的普遍生产资料
      </text>
    </g>
  </g>
</svg>
