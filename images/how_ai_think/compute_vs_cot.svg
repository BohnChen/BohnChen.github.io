<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="compBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Card 1 Gradient (Implicit) -->
    <linearGradient id="cardImp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Card 2 Gradient (Explicit CoT) -->
    <linearGradient id="cardExp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312e81" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="400" rx="16" fill="url(#compBg)" stroke="#334155" stroke-width="1.5" />

  <!-- Title -->
  <text x="50" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" font-size="20" font-weight="700" fill="#f8fafc">
    大模型思考的双重机制：内部隐式计算 vs 显式/思考 Token
  </text>
  <text x="50" y="74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" font-size="13" fill="#94a3b8">
    为什么单靠内部网络一步到位无法解决复杂推理，需要把“草稿”写在外面？
  </text>

  <!-- Left: 隐式计算 (单 Token 生成) -->
  <g transform="translate(50, 105)" filter="url(#cardShadow)">
    <rect width="425" height="260" rx="14" fill="url(#cardImp)" stroke="#38bdf8" stroke-width="1.5" />
    
    <!-- Header -->
    <rect x="20" y="18" width="32" height="32" rx="8" fill="#0284c7" fill-opacity="0.3" />
    <text x="29" y="39" font-family="sans-serif" font-size="16" fill="#38bdf8">🧠</text>
    <text x="62" y="40" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="700" fill="#f8fafc">内部隐式计算 (Implicit Compute)</text>
    
    <line x1="20" y1="62" x2="405" y2="62" stroke="#334155" stroke-width="1" />

    <text x="20" y="88" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#cbd5e1">
      <tspan x="20" dy="0">• <tspan font-weight="600" fill="#f1f5f9">发生位置：</tspan>GPU 显存与 Tensor Core 矩阵乘法</tspan>
      <tspan x="20" dy="25">• <tspan font-weight="600" fill="#f1f5f9">计算特点：</tspan>一个 70B 模型猜 1 个字需千亿次浮点运算</tspan>
      <tspan x="20" dy="25">• <tspan font-weight="600" fill="#f1f5f9">对外消耗：</tspan><tspan fill="#38bdf8" font-weight="700">0 额外 Token</tspan>（仅消耗电力与硬件延迟）</tspan>
      <tspan x="20" dy="25">• <tspan font-weight="600" fill="#ef4444">物理局限：</tspan>计算图深度恒定（O(1) 思考步骤）</tspan>
    </text>

    <!-- Visual Box -->
    <rect x="20" y="195" width="385" height="48" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="35" y="225" font-family="monospace" font-size="12" fill="#94a3b8">
      输入上下文 ──▶ [ 固定深度网络计算 ] ──▶ 输出答案
    </text>
  </g>

  <!-- Right: 显式思考 (CoT / o1 思考型模型) -->
  <g transform="translate(525, 105)" filter="url(#cardShadow)">
    <rect width="425" height="260" rx="14" fill="url(#cardExp)" stroke="#a855f7" stroke-width="2" />
    
    <!-- Header -->
    <rect x="20" y="18" width="32" height="32" rx="8" fill="#7e22ce" fill-opacity="0.4" />
    <text x="29" y="39" font-family="sans-serif" font-size="16" fill="#c084fc">📝</text>
    <text x="62" y="40" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="700" fill="#ffffff">显式 / 思考 Token (Reasoning Tokens)</text>
    
    <line x1="20" y1="62" x2="405" y2="62" stroke="#4338ca" stroke-width="1" />

    <text x="20" y="88" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#e2e8f0">
      <tspan x="20" dy="0">• <tspan font-weight="600" fill="#ffffff">实现形式：</tspan>思维链 (CoT) 或 o1/o3 内部思考阶段</tspan>
      <tspan x="20" dy="25">• <tspan font-weight="600" fill="#ffffff">计算特点：</tspan>把中间步骤写成 Token，反哺给后续注意网络</tspan>
      <tspan x="20" dy="25">• <tspan font-weight="600" fill="#ffffff">对外消耗：</tspan><tspan fill="#c084fc" font-weight="700">实际消耗计费 Token</tspan>（草稿纸成本）</tspan>
      <tspan x="20" dy="25">• <tspan font-weight="600" fill="#34d399">核心收益：</tspan>解除了固定深度限制，推理算力可线性扩展</tspan>
    </text>

    <!-- Visual Box -->
    <rect x="20" y="195" width="385" height="48" rx="8" fill="#0f172a" stroke="#6366f1" stroke-width="1" />
    <text x="32" y="225" font-family="monospace" font-size="11" fill="#c084fc">
      步骤1 (20tok) ─▶ 步骤2 (30tok) ─▶ 验证 ─▶ 最终答案
    </text>
  </g>
</svg>