<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgProcess" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080d1a" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#181335" />
    </linearGradient>

    <!-- Node Gradient Base -->
    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>

    <!-- Subtle Glow Filters -->
    <filter id="boxShadow">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="680" fill="url(#bgProcess)" rx="16" />

  <!-- Top Title & Badge -->
  <g transform="translate(60, 50)">
    <rect width="210" height="30" rx="15" fill="#38bdf8" fill-opacity="0.12" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.2" />
    <circle cx="16" cy="15" r="4.5" fill="#38bdf8" />
    <text x="30" y="19" fill="#7dd3fc" font-size="12" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" letter-spacing="1">SDD PROGRESSION PIPELINE</text>

    <text x="0" y="70" fill="#f8fafc" font-size="28" font-weight="800" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">规范驱动开发 (SDD) 渐进推演完整流程图</text>
    <text x="0" y="98" fill="#94a3b8" font-size="14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">严格把控「意图 ➔ 规约 ➔ 设计 ➔ 原子任务 ➔ Agent执行 ➔ 验证收敛」的端到端确定性闭环</text>
  </g>

  <!-- Flow Steps Container -->
  <g transform="translate(60, 190)">
    <!-- 1. Specify: What & Why -->
    <g transform="translate(0, 0)">
      <rect width="200" height="310" rx="12" fill="url(#nodeGrad)" stroke="#38bdf8" stroke-width="1.8" filter="url(#boxShadow)"/>
      <rect x="16" y="16" width="30" height="30" rx="8" fill="#0284c7" fill-opacity="0.25"/>
      <text x="31" y="36" fill="#38bdf8" font-size="15" font-weight="bold" font-family="sans-serif" text-anchor="middle">1</text>
      
      <text x="56" y="37" fill="#ffffff" font-size="17" font-weight="bold" font-family="sans-serif">Specify</text>
      <text x="16" y="72" fill="#38bdf8" font-size="14" font-weight="bold" font-family="sans-serif">定义清晰规约</text>
      <text x="16" y="92" fill="#64748b" font-size="11" font-family="monospace">Focus: What &amp; Why</text>
      
      <line x1="16" y1="108" x2="184" y2="108" stroke="#334155" stroke-width="1"/>

      <text x="16" y="132" fill="#e2e8f0" font-size="12" font-family="sans-serif">• 业务目标与真实意图</text>
      <text x="16" y="158" fill="#e2e8f0" font-size="12" font-family="sans-serif">• Given-When-Then 场景</text>
      <text x="16" y="184" fill="#e2e8f0" font-size="12" font-family="sans-serif">• 状态机与不可行边界</text>
      <text x="16" y="210" fill="#e2e8f0" font-size="12" font-family="sans-serif">• 明确非功能性契约</text>

      <!-- Artifact Tag -->
      <rect x="16" y="248" width="168" height="36" rx="8" fill="#0369a1" fill-opacity="0.2" stroke="#0284c7" stroke-width="1"/>
      <text x="100" y="271" fill="#7dd3fc" font-size="12" font-weight="bold" font-family="monospace" text-anchor="middle">📄 spec.md / proposal</text>
    </g>

    <!-- Arrow 1 -->
    <g transform="translate(202, 130)">
      <line x1="0" y1="20" x2="18" y2="20" stroke="#38bdf8" stroke-width="2.5"/>
      <polygon points="18,14 26,20 18,26" fill="#38bdf8" />
    </g>

    <!-- 2. Plan: Technical Architecture -->
    <g transform="translate(230, 0)">
      <rect width="200" height="310" rx="12" fill="url(#nodeGrad)" stroke="#818cf8" stroke-width="1.8" filter="url(#boxShadow)"/>
      <rect x="16" y="16" width="30" height="30" rx="8" fill="#4f46e5" fill-opacity="0.25"/>
      <text x="31" y="36" fill="#818cf8" font-size="15" font-weight="bold" font-family="sans-serif" text-anchor="middle">2</text>
      
      <text x="56" y="37" fill="#ffffff" font-size="17" font-weight="bold" font-family="sans-serif">Plan</text>
      <text x="16" y="72" fill="#818cf8" font-size="14" font-weight="bold" font-family="sans-serif">拟定技术架构</text>
      <text x="16" y="92" fill="#64748b" font-size="11" font-family="monospace">Focus: How to build</text>
      
      <line x1="16" y1="108" x2="184" y2="108" stroke="#334155" stroke-width="1"/>

      <text x="16" y="132" fill="#e2e8f0" font-size="12" font-family="sans-serif">• 框架选型与权衡决策</text>
      <text x="16" y="158" fill="#e2e8f0" font-size="12" font-family="sans-serif">• 领域实体与数据模型</text>
      <text x="16" y="184" fill="#e2e8f0" font-size="12" font-family="sans-serif">• 接口协议与幂等设计</text>
      <text x="16" y="210" fill="#e2e8f0" font-size="12" font-family="sans-serif">• 模块隔离与组件解耦</text>

      <!-- Artifact Tag -->
      <rect x="16" y="248" width="168" height="36" rx="8" fill="#4338ca" fill-opacity="0.2" stroke="#6366f1" stroke-width="1"/>
      <text x="100" y="271" fill="#c7d2fe" font-size="12" font-weight="bold" font-family="monospace" text-anchor="middle">📐 design.md</text>
    </g>

    <!-- Arrow 2 -->
    <g transform="translate(432, 130)">
      <line x1="0" y1="20" x2="18" y2="20" stroke="#818cf8" stroke-width="2.5"/>
      <polygon points="18,14 26,20 18,26" fill="#818cf8" />
    </g>

    <!-- 3. Tasks: Atomic Breakdown -->
    <g transform="translate(460, 0)">
      <rect width="200" height="310" rx="12" fill="url(#nodeGrad)" stroke="#c084fc" stroke-width="1.8" filter="url(#boxShadow)"/>
      <rect x="16" y="16" width="30" height="30" rx="8" fill="#7e22ce" fill-opacity="0.25"/>
      <text x="31" y="36" fill="#c084fc" font-size="15" font-weight="bold" font-family="sans-serif" text-anchor="middle">3</text>
      
      <text x="56" y="37" fill="#ffffff" font-size="17" font-weight="bold" font-family="sans-serif">Tasks</text>
      <text x="16" y="72" fill="#c084fc" font-size="14" font-weight="bold" font-family="sans-serif">拆解原子任务</text>
      <text x="16" y="92" fill="#64748b" font-size="11" font-family="monospace">Focus: Steps &amp; Order</text>
      
      <line x1="16" y1="108" x2="184" y2="108" stroke="#334155" stroke-width="1"/>

      <text x="16" y="132" fill="#e2e8f0" font-size="12" font-family="sans-serif">• 粒度控制在 2-5 分钟</text>
      <text x="16" y="158" fill="#e2e8f0" font-size="12" font-family="sans-serif">• 确定严格依赖前置条件</text>
      <text x="16" y="184" fill="#e2e8f0" font-size="12" font-family="sans-serif">• 明确各步自测检验指令</text>
      <text x="16" y="210" fill="#e2e8f0" font-size="12" font-family="sans-serif">• 测试用例编写先行排期</text>

      <!-- Artifact Tag -->
      <rect x="16" y="248" width="168" height="36" rx="8" fill="#6b21a8" fill-opacity="0.2" stroke="#a855f7" stroke-width="1"/>
      <text x="100" y="271" fill="#e9d5ff" font-size="12" font-weight="bold" font-family="monospace" text-anchor="middle">📋 tasks.md</text>
    </g>

    <!-- Arrow 3 -->
    <g transform="translate(662, 130)">
      <line x1="0" y1="20" x2="18" y2="20" stroke="#c084fc" stroke-width="2.5"/>
      <polygon points="18,14 26,20 18,26" fill="#c084fc" />
    </g>

    <!-- 4. Implement: Agent Execution -->
    <g transform="translate(690, 0)">
      <rect width="200" height="310" rx="12" fill="url(#nodeGrad)" stroke="#f472b6" stroke-width="1.8" filter="url(#boxShadow)"/>
      <rect x="16" y="16" width="30" height="30" rx="8" fill="#be185d" fill-opacity="0.25"/>
      <text x="31" y="36" fill="#f472b6" font-size="15" font-weight="bold" font-family="sans-serif" text-anchor="middle">4</text>
      
      <text x="56" y="37" fill="#ffffff" font-size="17" font-weight="bold" font-family="sans-serif">Implement</text>
      <text x="16" y="72" fill="#f472b6" font-size="14" font-weight="bold" font-family="sans-serif">Agent 依约执行</text>
      <text x="16" y="92" fill="#64748b" font-size="11" font-family="monospace">Focus: Context Hygiene</text>
      
      <line x1="16" y1="108" x2="184" y2="108" stroke="#334155" stroke-width="1"/>

      <text x="16" y="132" fill="#e2e8f0" font-size="12" font-family="sans-serif">• 严格对照 Task 逐项编码</text>
      <text x="16" y="158" fill="#e2e8f0" font-size="12" font-family="sans-serif">• 限制 AI 单点上下文范围</text>
      <text x="16" y="184" fill="#e2e8f0" font-size="12" font-family="sans-serif">• 伴生生成单元与集成测试</text>
      <text x="16" y="210" fill="#e2e8f0" font-size="12" font-family="sans-serif">• 绝不越权猜测未明需求</text>

      <!-- Artifact Tag -->
      <rect x="16" y="248" width="168" height="36" rx="8" fill="#9d174d" fill-opacity="0.2" stroke="#f43f5e" stroke-width="1"/>
      <text x="100" y="271" fill="#fecdd3" font-size="12" font-weight="bold" font-family="monospace" text-anchor="middle">💻 Code &amp; Unit Tests</text>
    </g>

    <!-- Arrow 4 -->
    <g transform="translate(892, 130)">
      <line x1="0" y1="20" x2="18" y2="20" stroke="#f472b6" stroke-width="2.5"/>
      <polygon points="18,14 26,20 18,26" fill="#f472b6" />
    </g>

    <!-- 5. Converge: Verification & Archive -->
    <g transform="translate(920, 0)">
      <rect width="160" height="310" rx="12" fill="url(#nodeGrad)" stroke="#34d399" stroke-width="1.8" filter="url(#boxShadow)"/>
      <rect x="16" y="16" width="30" height="30" rx="8" fill="#047857" fill-opacity="0.25"/>
      <text x="31" y="36" fill="#34d399" font-size="15" font-weight="bold" font-family="sans-serif" text-anchor="middle">5</text>
      
      <text x="56" y="37" fill="#ffffff" font-size="17" font-weight="bold" font-family="sans-serif">Converge</text>
      <text x="16" y="72" fill="#34d399" font-size="14" font-weight="bold" font-family="sans-serif">验收与收敛</text>
      <text x="16" y="92" fill="#64748b" font-size="11" font-family="monospace">Focus: Zero Drift</text>
      
      <line x1="16" y1="108" x2="144" y2="108" stroke="#334155" stroke-width="1"/>

      <text x="16" y="132" fill="#e2e8f0" font-size="12" font-family="sans-serif">• 测试套件全绿</text>
      <text x="16" y="158" fill="#e2e8f0" font-size="12" font-family="sans-serif">• 契约完全收敛</text>
      <text x="16" y="184" fill="#e2e8f0" font-size="12" font-family="sans-serif">• 人类架构审查</text>
      <text x="16" y="210" fill="#e2e8f0" font-size="12" font-family="sans-serif">• 归档入主真理</text>

      <!-- Artifact Tag -->
      <rect x="16" y="248" width="128" height="36" rx="8" fill="#065f46" fill-opacity="0.2" stroke="#10b981" stroke-width="1"/>
      <text x="80" y="271" fill="#a7f3d0" font-size="11" font-weight="bold" font-family="monospace" text-anchor="middle">📦 Archived Spec</text>
    </g>

    <!-- Divergence / Feedback Loop Path -->
    <path d="M 1000 320 C 1000 410, 100 410, 100 320" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="8,5" />
    <polygon points="96,325 100,312 104,325" fill="#f59e0b" />

    <!-- Feedback Loop Badge -->
    <g transform="translate(400, 392)">
      <rect width="400" height="34" rx="17" fill="#1e1b4b" stroke="#f59e0b" stroke-width="1.5"/>
      <circle cx="20" cy="17" r="5" fill="#f59e0b" />
      <text x="35" y="22" fill="#fde68a" font-size="12" font-weight="bold" font-family="sans-serif">若测试失败或契约偏差 ➔ 回溯调整规约/设计，绝不盲目打补丁</text>
    </g>
  </g>
</svg>
