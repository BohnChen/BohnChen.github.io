<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bgSdd" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f17" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="tradBox" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="sddBox" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="glowArrow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="1000" height="520" fill="url(#bgSdd)" rx="12" />

  <!-- Header -->
  <text x="50" y="45" fill="#f8fafc" font-size="22" font-weight="bold" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">开发范式演进：传统手工开发 vs 规范驱动开发 (SDD)</text>
  <text x="50" y="72" fill="#94a3b8" font-size="13" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">生产力本质逆转：人类从繁重的代码搬运工，升维为系统规约总设计师</text>

  <!-- SECTION 1: Traditional Development Pattern -->
  <g transform="translate(50, 95)">
    <!-- Container Card -->
    <rect width="900" height="175" rx="10" fill="url(#tradBox)" stroke="#334155" stroke-width="1.2" />
    <rect x="20" y="15" width="150" height="26" rx="13" fill="#334155" fill-opacity="0.6" />
    <text x="95" y="32" fill="#cbd5e1" font-size="12" font-weight="bold" font-family="sans-serif" text-anchor="middle">传统软件开发模式</text>
    <text x="185" y="33" fill="#64748b" font-size="12" font-family="sans-serif">特点：重度依赖人力手工敲代码，反馈周期漫长，容易陷入屎山泥潭</text>

    <!-- Flow: Step 1 -> Step 2 -> Step 3 -->
    <!-- Step 1 -->
    <g transform="translate(25, 55)">
      <rect width="250" height="95" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" filter="url(#shadow)"/>
      <circle cx="35" cy="35" r="16" fill="#334155" />
      <text x="35" y="41" fill="#94a3b8" font-size="15" text-anchor="middle">📝</text>
      <text x="65" y="35" fill="#e2e8f0" font-size="15" font-weight="bold" font-family="sans-serif">1. 人类编写需求与规范</text>
      <text x="65" y="55" fill="#94a3b8" font-size="12" font-family="sans-serif">PRD 文档、口头需求或初步设计</text>
      <text x="65" y="75" fill="#64748b" font-size="11" font-family="sans-serif">角色：产品经理 / 架构师</text>
    </g>

    <!-- Arrow 1 -->
    <g transform="translate(285, 95)">
      <line x1="0" y1="5" x2="35" y2="5" stroke="#64748b" stroke-width="2" stroke-dasharray="4,3"/>
      <polygon points="35,1 43,5 35,9" fill="#64748b" />
    </g>

    <!-- Step 2 -->
    <g transform="translate(335, 55)">
      <rect width="250" height="95" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.2" stroke-opacity="0.8" filter="url(#shadow)"/>
      <circle cx="35" cy="35" r="16" fill="#b45309" fill-opacity="0.3" />
      <text x="35" y="41" fill="#fcd34d" font-size="15" text-anchor="middle">⌨️</text>
      <text x="65" y="35" fill="#fef3c7" font-size="15" font-weight="bold" font-family="sans-serif">2. 人类手工编写代码</text>
      <text x="65" y="55" fill="#fbbf24" font-size="12" font-family="sans-serif">大量的样板代码、语法琐碎与 CRUD</text>
      <text x="65" y="75" fill="#d97706" font-size="11" font-weight="600" font-family="sans-serif">⏳ 最大瓶颈：耗时数周至数月</text>
    </g>

    <!-- Arrow 2 -->
    <g transform="translate(595, 95)">
      <line x1="0" y1="5" x2="35" y2="5" stroke="#64748b" stroke-width="2" stroke-dasharray="4,3"/>
      <polygon points="35,1 43,5 35,9" fill="#64748b" />
    </g>

    <!-- Step 3 -->
    <g transform="translate(645, 55)">
      <rect width="230" height="95" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" filter="url(#shadow)"/>
      <circle cx="35" cy="35" r="16" fill="#334155" />
      <text x="35" y="41" fill="#94a3b8" font-size="15" text-anchor="middle">🔍</text>
      <text x="65" y="35" fill="#e2e8f0" font-size="15" font-weight="bold" font-family="sans-serif">3. 人工调试与维护</text>
      <text x="65" y="55" fill="#94a3b8" font-size="12" font-family="sans-serif">手写零碎单元测试、线上肉身救火</text>
      <text x="65" y="75" fill="#64748b" font-size="11" font-family="sans-serif">随项目膨胀维护成本指数递增</text>
    </g>
  </g>

  <!-- SECTION 2: Specification-Driven Development (SDD) Pattern -->
  <g transform="translate(50, 290)">
    <!-- Container Card -->
    <rect width="900" height="205" rx="10" fill="url(#sddBox)" stroke="#6366f1" stroke-width="1.8" />
    <rect x="20" y="15" width="205" height="26" rx="13" fill="#4338ca" fill-opacity="0.8" />
    <text x="122" y="32" fill="#e0e7ff" font-size="12" font-weight="bold" font-family="sans-serif" text-anchor="middle">⚡️ 规范驱动开发模式 (SDD)</text>
    <text x="240" y="33" fill="#a5b4fc" font-size="12" font-family="sans-serif">核心理念：代码是编译中间产物，清晰可验证的规约（Spec）才是终极资产</text>

    <!-- Step 1: Spec -->
    <g transform="translate(20, 55)">
      <rect width="195" height="115" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" filter="url(#shadow)"/>
      <circle cx="30" cy="30" r="14" fill="#0369a1" fill-opacity="0.5" />
      <text x="30" y="35" fill="#7dd3fc" font-size="13" text-anchor="middle">🎯</text>
      <text x="52" y="35" fill="#f8fafc" font-size="14" font-weight="bold" font-family="sans-serif">1. 制定严谨规约</text>
      <text x="15" y="65" fill="#7dd3fc" font-size="11" font-family="monospace">Spec / 类型系统 / 契约</text>
      <text x="15" y="85" fill="#94a3b8" font-size="11" font-family="sans-serif">明确领域边界与状态转移</text>
      <text x="15" y="105" fill="#38bdf8" font-size="11" font-weight="bold" font-family="sans-serif">🧑 人类核心发力点</text>
    </g>

    <!-- Arrow 1 -->
    <g transform="translate(220, 105)">
      <line x1="0" y1="5" x2="25" y2="5" stroke="#38bdf8" stroke-width="2.5" />
      <polygon points="25,1 33,5 25,9" fill="#38bdf8" />
    </g>

    <!-- Step 2: AI Synthesis -->
    <g transform="translate(260, 55)">
      <rect width="195" height="115" rx="8" fill="#0f172a" stroke="#c084fc" stroke-width="1.5" filter="url(#shadow)"/>
      <circle cx="30" cy="30" r="14" fill="#6b21a8" fill-opacity="0.5" />
      <text x="30" y="35" fill="#e9d5ff" font-size="13" text-anchor="middle">🤖</text>
      <text x="52" y="35" fill="#f8fafc" font-size="14" font-weight="bold" font-family="sans-serif">2. AI 批量极速生成</text>
      <text x="15" y="65" fill="#e9d5ff" font-size="11" font-family="monospace">Zero-shot / Agent Coding</text>
      <text x="15" y="85" fill="#94a3b8" font-size="11" font-family="sans-serif">秒级生成生产代码与用例</text>
      <text x="15" y="105" fill="#c084fc" font-size="11" font-weight="bold" font-family="sans-serif">⚡️ 边际成本趋近于零</text>
    </g>

    <!-- Arrow 2 -->
    <g transform="translate(460, 105)">
      <line x1="0" y1="5" x2="25" y2="5" stroke="#a855f7" stroke-width="2.5" />
      <polygon points="25,1 33,5 25,9" fill="#a855f7" />
    </g>

    <!-- Step 3: Automated Verification -->
    <g transform="translate(500, 55)">
      <rect width="195" height="115" rx="8" fill="#0f172a" stroke="#34d399" stroke-width="1.5" filter="url(#shadow)"/>
      <circle cx="30" cy="30" r="14" fill="#065f46" fill-opacity="0.5" />
      <text x="30" y="35" fill="#a7f3d0" font-size="13" text-anchor="middle">🛡️</text>
      <text x="52" y="35" fill="#f8fafc" font-size="14" font-weight="bold" font-family="sans-serif">3. 自动化严密质检</text>
      <text x="15" y="65" fill="#a7f3d0" font-size="11" font-family="monospace">Test Suite / Linter / CI</text>
      <text x="15" y="85" fill="#94a3b8" font-size="11" font-family="sans-serif">契约测试、状态断言兜底</text>
      <text x="15" y="105" fill="#34d399" font-size="11" font-weight="bold" font-family="sans-serif">🔄 失败即刻反哺 AI 修正</text>
    </g>

    <!-- Arrow 3 -->
    <g transform="translate(700, 105)">
      <line x1="0" y1="5" x2="25" y2="5" stroke="#34d399" stroke-width="2.5" />
      <polygon points="25,1 33,5 25,9" fill="#34d399" />
    </g>

    <!-- Step 4: Human Review & Evolution -->
    <g transform="translate(740, 55)">
      <rect width="140" height="115" rx="8" fill="#0f172a" stroke="#818cf8" stroke-width="1.5" filter="url(#shadow)"/>
      <circle cx="30" cy="30" r="14" fill="#3730a3" fill-opacity="0.5" />
      <text x="30" y="35" fill="#c7d2fe" font-size="13" text-anchor="middle">🏛️</text>
      <text x="50" y="35" fill="#f8fafc" font-size="13" font-weight="bold" font-family="sans-serif">4. Review 演进</text>
      <text x="12" y="65" fill="#cbd5e1" font-size="11" font-family="sans-serif">审查架构合理性</text>
      <text x="12" y="85" fill="#94a3b8" font-size="11" font-family="sans-serif">把控长期演进方向</text>
      <text x="12" y="105" fill="#818cf8" font-size="11" font-weight="bold" font-family="sans-serif">🧑 系统总架构师</text>
    </g>

    <!-- Feedback Loop Line: from Step 3 / 4 back to Step 1 -->
    <path d="M 770 172 C 770 195, 115 195, 115 172" fill="none" stroke="#6366f1" stroke-width="1.8" stroke-dasharray="5,4" />
    <polygon points="112,172 115,164 118,172" fill="#6366f1" />
    <text x="450" y="196" fill="#a5b4fc" font-size="11" font-family="sans-serif" text-anchor="middle">不断根据业务迭代调优 Spec，持续自动化演进</text>
  </g>
</svg>
