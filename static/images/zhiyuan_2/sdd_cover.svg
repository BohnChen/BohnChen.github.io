<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgCover" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14" />
      <stop offset="40%" stop-color="#0b132b" />
      <stop offset="100%" stop-color="#1c113b" />
    </linearGradient>

    <!-- Accent Glows -->
    <radialGradient id="glowLeft" cx="20%" cy="30%" r="45%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowRight" cx="80%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </radialGradient>

    <!-- Card Gradients -->
    <linearGradient id="specCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>
    <linearGradient id="codeCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>

    <!-- Title Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#e0e7ff" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <filter id="shadow">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="630" fill="url(#bgCover)" />
  <rect width="1200" height="630" fill="url(#glowLeft)" />
  <rect width="1200" height="630" fill="url(#glowRight)" />

  <!-- Subtle Decorative Grid Elements -->
  <g stroke="#334155" stroke-opacity="0.2" stroke-width="1">
    <line x1="80" y1="0" x2="80" y2="630" />
    <line x1="1120" y1="0" x2="1120" y2="630" />
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="550" x2="1200" y2="550" />
  </g>

  <!-- Top Badge -->
  <g transform="translate(100, 110)">
    <rect width="230" height="34" rx="17" fill="#38bdf8" fill-opacity="0.12" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.2" />
    <circle cx="20" cy="17" r="5" fill="#38bdf8" />
    <text x="35" y="22" fill="#7dd3fc" font-size="13" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" letter-spacing="1">AI CODING PARADIGM</text>
  </g>

  <!-- Main Headline & Subtitle -->
  <text x="100" y="210" fill="url(#textGrad)" font-size="52" font-weight="800" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" letter-spacing="-0.5">规范驱动开发 (SDD)</text>
  <text x="100" y="265" fill="#94a3b8" font-size="22" font-weight="400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">在 AI 编程浪潮中构建确定性 · The Power Inversion</text>

  <!-- Visual Metaphor: Specification -->
  <g transform="translate(100, 320)">
    <!-- Card 1: The Specification (Primary Asset) -->
    <g transform="translate(0, 0)">
      <rect width="360" height="180" rx="12" fill="url(#specCard)" stroke="#38bdf8" stroke-width="1.8" filter="url(#shadow)"/>
      <rect x="24" y="22" width="100" height="24" rx="6" fill="#0284c7" fill-opacity="0.25"/>
      <text x="74" y="38" fill="#38bdf8" font-size="12" font-weight="700" font-family="sans-serif" text-anchor="middle">SPECIFICATION</text>
      
      <text x="24" y="80" fill="#f8fafc" font-size="20" font-weight="bold" font-family="sans-serif">规约即真理资产</text>
      <text x="24" y="110" fill="#94a3b8" font-size="13" font-family="sans-serif">• 意图对齐与领域边界</text>
      <text x="24" y="132" fill="#94a3b8" font-size="13" font-family="sans-serif">• 契约断言 (Given-When-Then)</text>
      <text x="24" y="156" fill="#38bdf8" font-size="12" font-weight="600" font-family="sans-serif">人类掌控方向与质量标准</text>
    </g>

    <!-- Dynamic Flow Arrow with "Synthesizes" Tag -->
    <g transform="translate(378, 65)">
      <!-- Pulsing Glow Line -->
      <line x1="0" y1="25" x2="84" y2="25" stroke="#818cf8" stroke-width="3" stroke-dasharray="6,4"/>
      <polygon points="84,18 98,25 84,32" fill="#818cf8" />
      <rect x="12" y="2" width="70" height="20" rx="10" fill="#1e1b4b" stroke="#818cf8" stroke-width="1" />
      <text x="47" y="16" fill="#c7d2fe" font-size="10" font-weight="bold" font-family="sans-serif" text-anchor="middle">AI 合成</text>
    </g>

    <!-- Card 2: Generated Code (Derived Artifact) -->
    <g transform="translate(490, 0)">
      <rect width="360" height="180" rx="12" fill="url(#codeCard)" stroke="#c084fc" stroke-width="1.8" filter="url(#shadow)"/>
      <rect x="24" y="22" width="100" height="24" rx="6" fill="#7c3aed" fill-opacity="0.25"/>
      <text x="74" y="38" fill="#d8b4fe" font-size="12" font-weight="700" font-family="sans-serif" text-anchor="middle">IMPLEMENTATION</text>
      
      <text x="24" y="80" fill="#f8fafc" font-size="20" font-weight="bold" font-family="sans-serif">代码为编译衍生品</text>
      <text x="24" y="110" fill="#94a3b8" font-size="13" font-family="sans-serif">• 极速批量代码生产</text>
      <text x="24" y="132" fill="#94a3b8" font-size="13" font-family="sans-serif">• 全自动伴生单元测试</text>
      <text x="24" y="156" fill="#c084fc" font-size="12" font-weight="600" font-family="sans-serif">持续验证并向规范收敛</text>
    </g>

    <!-- Right Accents: Minimal Tag Pill -->
    <g transform="translate(880, 45)">
      <rect width="120" height="90" rx="10" fill="#1e293b" fill-opacity="0.5" stroke="#334155" stroke-width="1"/>
      <text x="60" y="35" fill="#e2e8f0" font-size="12" font-weight="bold" font-family="sans-serif" text-anchor="middle">TDD ➔ BDD</text>
      <text x="60" y="55" fill="#38bdf8" font-size="14" font-weight="extrabold" font-family="sans-serif" text-anchor="middle">➔ SDD</text>
      <text x="60" y="73" fill="#64748b" font-size="10" font-family="sans-serif" text-anchor="middle">Power Inversion</text>
    </g>
  </g>
</svg>
