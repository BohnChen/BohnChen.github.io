<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>
    <filter id="blurFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" />
    </filter>
    <filter id="glowEffect">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- Background Ambient Glows -->
  <circle cx="200" cy="150" r="180" fill="#0284c7" opacity="0.25" filter="url(#blurFilter)" />
  <circle cx="1000" cy="450" r="220" fill="#7c3aed" opacity="0.2" filter="url(#blurFilter)" />
  <circle cx="600" cy="300" r="150" fill="#0d9488" opacity="0.15" filter="url(#blurFilter)" />

  <!-- Grid lines -->
  <g stroke="#334155" stroke-opacity="0.2" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="630" />
    <line x1="300" y1="0" x2="300" y2="630" />
    <line x1="500" y1="0" x2="500" y2="630" />
    <line x1="700" y1="0" x2="700" y2="630" />
    <line x1="900" y1="0" x2="900" y2="630" />
    <line x1="1100" y1="0" x2="1100" y2="630" />
    <line x1="0" y1="100" x2="1200" y2="100" />
    <line x1="0" y1="250" x2="1200" y2="250" />
    <line x1="0" y1="400" x2="1200" y2="400" />
    <line x1="0" y1="550" x2="1200" y2="550" />
  </g>

  <!-- Central Graphic Cards: Human Specification & AI Generation -->
  <g transform="translate(100, 140)">
    <!-- Left Card: Human Architectural Thinking & Spec -->
    <rect x="0" y="0" width="380" height="340" rx="16" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.4" />
    <rect x="25" y="25" width="40" height="40" rx="8" fill="#0369a1" fill-opacity="0.5" />
    <path d="M35 45 L45 35 L55 45 M45 35 L45 55" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="80" y="52" fill="#f8fafc" font-size="20" font-weight="bold" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">Human : Specification</text>
    <text x="25" y="105" fill="#94a3b8" font-size="14" font-family="monospace">// 系统设计与抽象能力</text>
    <text x="25" y="135" fill="#38bdf8" font-size="15" font-family="monospace">type Architecture = {</text>
    <text x="45" y="165" fill="#e2e8f0" font-size="14" font-family="monospace">domainLogic: ClearBoundary;</text>
    <text x="45" y="195" fill="#e2e8f0" font-size="14" font-family="monospace">concurrency: LockFreeQueue;</text>
    <text x="45" y="225" fill="#e2e8f0" font-size="14" font-family="monospace">validation: StrictContracts;</text>
    <text x="25" y="255" fill="#38bdf8" font-size="15" font-family="monospace">};</text>
    <rect x="25" y="285" width="330" height="32" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="40" y="306" fill="#38bdf8" font-size="13" font-family="monospace">✦ 认知上限决定系统上限</text>
  </g>

  <!-- Connective Synapse / Bridge -->
  <g transform="translate(480, 280)">
    <path d="M 15 30 C 70 -20, 170 -20, 225 30" fill="none" stroke="url(#glow)" stroke-width="4" stroke-dasharray="6,6" filter="url(#glowEffect)"/>
    <circle cx="120" cy="5" r="28" fill="#1e1b4b" stroke="#818cf8" stroke-width="2" />
    <text x="120" y="10" fill="#a5b4fc" font-size="12" font-weight="bold" font-family="sans-serif" text-anchor="middle">SDD</text>
    <text x="120" y="45" fill="#c7d2fe" font-size="13" font-weight="600" font-family="-apple-system, sans-serif" text-anchor="middle">规范驱动开发</text>
  </g>

  <g transform="translate(720, 140)">
    <!-- Right Card: AI High Speed Execution -->
    <rect x="0" y="0" width="380" height="340" rx="16" fill="url(#cardGrad)" stroke="#c084fc" stroke-width="1.5" stroke-opacity="0.4" />
    <rect x="25" y="25" width="40" height="40" rx="8" fill="#581c87" fill-opacity="0.5" />
    <path d="M37 45 L43 35 L47 45 L53 35" stroke="#c084fc" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="80" y="52" fill="#f8fafc" font-size="20" font-weight="bold" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">AI : High-speed Synthesis</text>
    <text x="25" y="105" fill="#94a3b8" font-size="14" font-family="monospace">// 极速实现与代码生成</text>
    <text x="25" y="135" fill="#c084fc" font-size="15" font-family="monospace">async function synthesize() {</text>
    <text x="45" y="165" fill="#e2e8f0" font-size="14" font-family="monospace">  await implement(spec);</text>
    <text x="45" y="195" fill="#e2e8f0" font-size="14" font-family="monospace">  await generateUnitTests();</text>
    <text x="45" y="225" fill="#e2e8f0" font-size="14" font-family="monospace">  return productionCode;</text>
    <text x="25" y="255" fill="#c084fc" font-size="15" font-family="monospace">}</text>
    <rect x="25" y="285" width="330" height="32" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="40" y="306" fill="#c084fc" font-size="13" font-family="monospace">✦ 放大效率，亦放大架构设计</text>
  </g>

  <!-- Big Title and Subtitle at the bottom -->
  <g transform="translate(600, 530)">
    <text x="0" y="0" fill="#f8fafc" font-size="34" font-weight="900" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" text-anchor="middle" letter-spacing="1">
      在这个直奔 AGI 的时代，学点编程吧
    </text>
    <text x="0" y="35" fill="#94a3b8" font-size="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" text-anchor="middle" letter-spacing="0.5">
      AI is not just for you, it is you —— 从代码工人到系统设计者与规约构建者
    </text>
  </g>
</svg>
