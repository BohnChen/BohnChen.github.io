<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 620" width="1050" height="620">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", sans-serif; font-weight: bold; font-size: 20px; fill: #1e293b; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", sans-serif; font-size: 14px; fill: #64748b; }
      .box-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", sans-serif; font-weight: bold; font-size: 15px; fill: #0f172a; }
      .box-text { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; font-size: 13px; fill: #334155; }
      .box-note { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", sans-serif; font-size: 11px; fill: #64748b; }
      .badge { font-family: "SFMono-Regular", Consolas, Menlo, monospace; font-size: 11px; font-weight: bold; }
      .arrow { stroke: #2563eb; stroke-width: 2.5; fill: none; stroke-linecap: round; }
      .arrow-purple { stroke: #9333ea; stroke-width: 2.5; fill: none; stroke-linecap: round; }
    </style>
    <marker id="arrowhead-blue" markerWidth="9" markerHeight="7" refX="7" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#2563eb" />
    </marker>
    <marker id="arrowhead-purple" markerWidth="9" markerHeight="7" refX="7" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#9333ea" />
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1050" height="620" fill="#f8fafc" rx="12" />

  <!-- Header -->
  <text x="40" y="45" class="title">C++ 运行时多态内存模型与动态绑定原理</text>
  <text x="40" y="70" class="subtitle">虚函数指针 (_vfptr) ➔ 虚函数表 (vtable) ➔ 代码段/只读数据段 (.rodata / .text)</text>

  <!-- 1. 对象内存区 (Stack / Heap) -->
  <g transform="translate(40, 105)" filter="url(#shadow)">
    <rect width="260" height="460" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
    <rect width="260" height="42" rx="10" fill="#eff6ff" />
    <text x="20" y="27" class="box-title">栈区/堆区 (对象内部结构)</text>

    <!-- Base Object Box -->
    <rect x="15" y="60" width="230" height="150" rx="8" fill="#f8fafc" stroke="#93c5fd" stroke-width="1.5" />
    <text x="25" y="82" class="badge" fill="#1d4ed8">Base 对象实例 (baseObj)</text>
    
    <rect x="25" y="95" width="210" height="40" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1" />
    <text x="35" y="115" class="box-text" font-weight="bold">_vfptr (虚指针)</text>
    <text x="35" y="129" class="box-note">指向 Base 虚函数表 (8 字节)</text>
    <circle id="base-vfptr-dot" cx="225" cy="115" r="4" fill="#2563eb" />

    <rect x="25" y="145" width="210" height="45" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" />
    <text x="35" y="166" class="box-text">int _ia = 10;</text>
    <text x="35" y="180" class="box-note">基类普通数据成员 (4 字节)</text>

    <!-- Derive Object Box -->
    <rect x="15" y="235" width="230" height="205" rx="8" fill="#faf5ff" stroke="#d8b4fe" stroke-width="1.5" />
    <text x="25" y="257" class="badge" fill="#7e22ce">Derive 对象实例 (deriveObj)</text>

    <rect x="25" y="270" width="210" height="40" rx="6" fill="#f3e8ff" stroke="#a855f7" stroke-width="1" />
    <text x="35" y="290" class="box-text" font-weight="bold">_vfptr (虚指针)</text>
    <text x="35" y="304" class="box-note">指向 Derive 虚函数表 (8 字节)</text>
    <circle id="derive-vfptr-dot" cx="225" cy="290" r="4" fill="#9333ea" />

    <rect x="25" y="320" width="210" height="45" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" />
    <text x="35" y="341" class="box-text">int _ia (继承自 Base)</text>
    <text x="35" y="355" class="box-note">基类子对象成员</text>

    <rect x="25" y="375" width="210" height="45" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" />
    <text x="35" y="396" class="box-text">int _id = 20;</text>
    <text x="35" y="410" class="box-note">派生类新增成员</text>
  </g>

  <!-- 2. 只读数据段: 虚函数表 (vtable) -->
  <g transform="translate(370, 105)" filter="url(#shadow)">
    <rect width="280" height="460" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
    <rect width="280" height="42" rx="10" fill="#f1f5f9" />
    <text x="20" y="27" class="box-title">只读数据段 (.rodata) - 虚函数表</text>

    <!-- Base vtable -->
    <rect x="15" y="60" width="250" height="150" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5" />
    <text x="25" y="82" class="badge" fill="#1d4ed8">vtable for Base (类独有一份)</text>
    
    <rect x="25" y="95" width="230" height="42" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1" />
    <text x="35" y="114" class="box-text">[0] &amp;Base::display</text>
    <text x="35" y="128" class="box-note">偏移 0: 虚析构或第1个虚函数</text>
    <circle id="vtab-base-0" cx="245" cy="116" r="4" fill="#2563eb" />

    <rect x="25" y="145" width="230" height="42" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1" />
    <text x="35" y="164" class="box-text">[1] &amp;Base::print</text>
    <text x="35" y="178" class="box-note">偏移 1: 第2个虚函数指针</text>
    <circle id="vtab-base-1" cx="245" cy="166" r="4" fill="#2563eb" />

    <!-- Derive vtable -->
    <rect x="15" y="235" width="250" height="205" rx="8" fill="#ffffff" stroke="#d8b4fe" stroke-width="1.5" />
    <text x="25" y="257" class="badge" fill="#7e22ce">vtable for Derive (覆盖/重写)</text>

    <rect x="25" y="270" width="230" height="50" rx="6" fill="#fdf4ff" stroke="#e9d5ff" stroke-width="1" />
    <text x="35" y="291" class="box-text" fill="#7e22ce" font-weight="bold">[0] &amp;Derive::display</text>
    <text x="35" y="308" class="box-note" fill="#a21caf">已重写 (覆盖了 Base::display)</text>
    <circle id="vtab-der-0" cx="245" cy="295" r="4" fill="#9333ea" />

    <rect x="25" y="330" width="230" height="45" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
    <text x="35" y="350" class="box-text">[1] &amp;Base::print</text>
    <text x="35" y="365" class="box-note">未重写 (沿用 Base 虚函数)</text>
    <circle id="vtab-der-1" cx="245" cy="352" r="4" fill="#64748b" />

    <rect x="25" y="385" width="230" height="45" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
    <text x="35" y="405" class="box-text">[2] &amp;Derive::custom</text>
    <text x="35" y="420" class="box-note">子类新增的虚函数</text>
    <circle id="vtab-der-2" cx="245" cy="407" r="4" fill="#9333ea" />
  </g>

  <!-- 3. 代码段: 实际函数机器指令 -->
  <g transform="translate(720, 105)" filter="url(#shadow)">
    <rect width="290" height="460" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
    <rect width="290" height="42" rx="10" fill="#ecfdf5" />
    <text x="20" y="27" class="box-title">代码段 (.text) - 目标机器指令</text>

    <!-- Base Functions -->
    <rect x="15" y="60" width="260" height="50" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1" />
    <text x="25" y="82" class="box-text" font-weight="bold">Base::display()</text>
    <text x="25" y="98" class="box-note">函数指令起始地址 0x00401120</text>

    <rect x="15" y="125" width="260" height="50" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1" />
    <text x="25" y="147" class="box-text" font-weight="bold">Base::print()</text>
    <text x="25" y="163" class="box-note">函数指令起始地址 0x00401160</text>

    <!-- Derive Functions -->
    <rect x="15" y="235" width="260" height="50" rx="6" fill="#fdf2f8" stroke="#f472b6" stroke-width="1" />
    <text x="25" y="257" class="box-text" font-weight="bold" fill="#be185d">Derive::display()</text>
    <text x="25" y="273" class="box-note">重写后的指令地址 0x00402210</text>

    <rect x="15" y="300" width="260" height="50" rx="6" fill="#fdf2f8" stroke="#f472b6" stroke-width="1" />
    <text x="25" y="322" class="box-text" font-weight="bold" fill="#be185d">Derive::custom()</text>
    <text x="25" y="338" class="box-note">子类特有指令地址 0x00402280</text>

    <rect x="15" y="380" width="260" height="65" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
    <text x="25" y="402" class="badge" fill="#475569">💡 动态绑定调用过程：</text>
    <text x="25" y="420" class="box-note">ptr-&gt;display() 等价于：</text>
    <text x="25" y="435" class="box-text" font-size="11px">(*(ptr-&gt;_vfptr[0]))(ptr);</text>
  </g>

  <!-- 连接箭头：对象 _vfptr -> vtable -->
  <!-- Base obj _vfptr to Base vtable -->
  <path d="M 290 220 C 330 220, 335 180, 385 180" class="arrow" marker-end="url(#arrowhead-blue)" />
  <!-- Derive obj _vfptr to Derive vtable -->
  <path d="M 290 395 C 330 395, 335 365, 385 365" class="arrow-purple" marker-end="url(#arrowhead-purple)" />

  <!-- 连接箭头：vtable -> 函数代码段 -->
  <!-- Base::display() -->
  <path d="M 645 221 C 680 221, 685 190, 735 190" class="arrow" marker-end="url(#arrowhead-blue)" />
  <!-- Base::print() from Base vtable -->
  <path d="M 645 271 C 675 271, 680 255, 735 255" class="arrow" marker-end="url(#arrowhead-blue)" />

  <!-- Derive::display() from Derive vtable -->
  <path d="M 645 400 C 680 400, 685 365, 735 365" class="arrow-purple" marker-end="url(#arrowhead-purple)" />
  <!-- Base::print() from Derive vtable (未重写) -->
  <path d="M 645 457 C 690 457, 690 260, 735 260" stroke="#64748b" stroke-width="1.8" stroke-dasharray="4 3" fill="none" marker-end="url(#arrowhead-blue)" />
  <!-- Derive::custom() -->
  <path d="M 645 512 C 680 512, 685 430, 735 430" class="arrow-purple" marker-end="url(#arrowhead-purple)" />

</svg>