<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Glows -->
    <radialGradient id="glowLeft" cx="18%" cy="30%" r="45%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowRight" cx="82%" cy="65%" r="50%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowCenter" cx="50%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0" />
    </radialGradient>

    <!-- Card Background -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.88" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.94" />
    </linearGradient>

    <linearGradient id="cardGradHighlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312e81" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>

    <!-- Title Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#e0e7ff" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />
  <rect width="1200" height="630" fill="url(#glowLeft)" />
  <rect width="1200" height="630" fill="url(#glowRight)" />
  <rect width="1200" height="630" fill="url(#glowCenter)" />

  <!-- Subtle Grid Lines -->
  <g stroke="#334155" stroke-opacity="0.25" stroke-width="1">
    <line x1="80" y1="0" x2="80" y2="630" />
    <line x1="1120" y1="0" x2="1120" y2="630" />
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="550" x2="1200" y2="550" />
  </g>

  <!-- Top Badge -->
  <g transform="translate(100, 75)">
    <rect width="210" height="34" rx="17" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.6" />
    <circle cx="18" cy="17" r="5" fill="#38bdf8" />
    <text x="32" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" font-size="13" font-weight="600" fill="#38bdf8" letter-spacing="1">AI 认知探秘 · 机制篇</text>
  </g>

  <!-- Title & Subtitle -->
  <text x="100" y="165" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" font-size="44" font-weight="800" fill="url(#titleGrad)" letter-spacing="-0.5">
    AI 输出的每个字，是思考出来的吗？
  </text>
  <text x="100" y="210" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" font-size="18" font-weight="400" fill="#94a3b8">
    从 Next-Token Prediction 概率接龙，到隐式世界模型与思维链推理的本质揭秘
  </text>

  <!-- Cards Section: Three Core Dimensions -->
  <!-- Card 1: 表面机制 -->
  <g transform="translate(100, 255)" filter="url(#shadow)">
    <rect width="305" height="240" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
    
    <rect x="20" y="22" width="36" height="36" rx="8" fill="#0369a1" fill-opacity="0.4" />
    <text x="31" y="46" font-family="sans-serif" font-size="18" fill="#38bdf8">🎲</text>

    <text x="68" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" font-size="17" font-weight="700" fill="#f8fafc">表面：概率接龙</text>
    <text x="20" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" font-size="13" font-weight="600" fill="#38bdf8">Next-Token Prediction</text>

    <text x="20" y="118" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" font-size="13" fill="#94a3b8" line-height="1.5">
      <tspan x="20" dy="0">• 高维向量空间坐标表征</tspan>
      <tspan x="20" dy="24">• 自注意力捕捉上下文关联</tspan>
      <tspan x="20" dy="24">• Softmax 输出词表概率分布</tspan>
      <tspan x="20" dy="24">• 逐字滚动采样生成</tspan>
    </text>
    <rect x="20" y="195" width="265" height="28" rx="6" fill="#0f172a" />
    <text x="32" y="214" font-family="monospace" font-size="12" fill="#38bdf8">P(w_t | w_1, ..., w_{t-1})</text>
  </g>

  <!-- Card 2: 深层本质 (Highlighted) -->
  <g transform="translate(445, 255)" filter="url(#shadow)">
    <rect width="310" height="240" rx="16" fill="url(#cardGradHighlight)" stroke="#818cf8" stroke-width="2" />
    
    <rect x="20" y="22" width="36" height="36" rx="8" fill="#4338ca" fill-opacity="0.5" />
    <text x="31" y="46" font-family="sans-serif" font-size="18" fill="#a5b4fc">🌐</text>

    <text x="68" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" font-size="17" font-weight="700" fill="#ffffff">深层：隐式世界模型</text>
    <text x="20" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" font-size="13" font-weight="600" fill="#a5b4fc">Emergent World Representation</text>

    <text x="20" y="118" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" font-size="13" fill="#cbd5e1">
      <tspan x="20" dy="0">• 预测越准，越需理解底层现实</tspan>
      <tspan x="20" dy="24">• 内部自发构建物理与因果映射</tspan>
      <tspan x="20" dy="24">• “表面是统计，背后是理解”</tspan>
      <tspan x="20" dy="24">• 具有逻辑推演与高维表征能力</tspan>
    </text>
    <rect x="20" y="195" width="270" height="28" rx="6" fill="#0f172a" />
    <text x="32" y="214" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" font-size="12" fill="#c084fc">Ilya Sutskever · 经典假说</text>
  </g>

  <!-- Card 3: 算力与思考演进 -->
  <g transform="translate(795, 255)" filter="url(#shadow)">
    <rect width="305" height="240" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
    
    <rect x="20" y="22" width="36" height="36" rx="8" fill="#581c87" fill-opacity="0.4" />
    <text x="31" y="46" font-family="sans-serif" font-size="18" fill="#c084fc">⚡</text>

    <text x="68" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" font-size="17" font-weight="700" fill="#f8fafc">演进：从隐式到显式</text>
    <text x="20" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" font-size="13" font-weight="600" fill="#c084fc">Reasoning &amp; Compute</text>

    <text x="20" y="118" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" font-size="13" fill="#94a3b8">
      <tspan x="20" dy="0">• 内部浮点矩阵乘法 (无对外Token)</tspan>
      <tspan x="20" dy="24">• 单Token网络深度固定 (无法骤想)</tspan>
      <tspan x="20" dy="24">• 思维链 (CoT)：显式步骤强化推理</tspan>
      <tspan x="20" dy="24">• 推理模型 (o1/o3)：内部思考Token</tspan>
    </text>
    <rect x="20" y="195" width="265" height="28" rx="6" fill="#0f172a" />
    <text x="32" y="214" font-family="monospace" font-size="12" fill="#a78bfa">&lt;thinking&gt; ... &lt;/thinking&gt;</text>
  </g>

  <!-- Footer Info -->
  <g transform="translate(100, 565)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" font-size="13" fill="#64748b">
      Bohn's Tech Notes · 深入探寻大语言模型认知与计算核心
    </text>
    <text x="1000" y="0" text-anchor="end" font-family="monospace" font-size="13" fill="#64748b">
      bohnchen.github.io
    </text>
  </g>
</svg>