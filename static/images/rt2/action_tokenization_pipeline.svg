<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="pBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>

    <!-- Card Backgrounds -->
    <linearGradient id="pCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="pCardActive" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Number Pill Gradients -->
    <linearGradient id="numBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="numPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>
    <linearGradient id="numGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <filter id="pShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="480" rx="16" fill="url(#pBg)" stroke="#334155" stroke-width="1.5" />

  <!-- Title Section -->
  <text x="50" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" font-size="22" font-weight="800" fill="#f8fafc">
    机器人动作的“词元化”三步流
  </text>
  <text x="50" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" font-size="13" font-weight="400" fill="#94a3b8">
    从连续物理量到 256 离散装箱，再到直接复用大模型词表 Token 的完整流水线
  </text>

  <!-- Step 1 Card -->
  <g transform="translate(50, 115)" filter="url(#pShadow)">
    <rect width="270" height="320" rx="14" fill="url(#pCard)" stroke="#334155" stroke-width="1.5" />
    
    <!-- Step Badge -->
    <rect x="20" y="20" width="70" height="26" rx="13" fill="url(#numBlue)" />
    <text x="55" y="37" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">Step 1</text>

    <text x="20" y="78" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="16" font-weight="700" fill="#f8fafc">
      8 维连续动作定义
    </text>
    <text x="20" y="100" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#64748b">
      Continuous Physical Actions
    </text>

    <!-- Sub items -->
    <g transform="translate(20, 120)">
      <rect width="230" height="30" rx="6" fill="#0f172a" />
      <text x="12" y="20" font-family="monospace" font-size="11" fill="#38bdf8">x, y, z</text>
      <text x="75" y="20" font-family="'PingFang SC', sans-serif" font-size="11" fill="#94a3b8">3 维末端平移变化量</text>
    </g>

    <g transform="translate(20, 158)">
      <rect width="230" height="30" rx="6" fill="#0f172a" />
      <text x="12" y="20" font-family="monospace" font-size="11" fill="#38bdf8">r, p, y</text>
      <text x="75" y="20" font-family="'PingFang SC', sans-serif" font-size="11" fill="#94a3b8">3 维旋转（横滚/俯仰/偏航）</text>
    </g>

    <g transform="translate(20, 196)">
      <rect width="230" height="30" rx="6" fill="#0f172a" />
      <text x="12" y="20" font-family="monospace" font-size="11" fill="#38bdf8">grip, term</text>
      <text x="95" y="20" font-family="'PingFang SC', sans-serif" font-size="11" fill="#94a3b8">夹爪开合 + 终止符</text>
    </g>

    <!-- Example box -->
    <g transform="translate(20, 240)">
      <rect width="230" height="60" rx="8" fill="#0b1329" stroke="#1e293b" stroke-width="1" />
      <text x="10" y="20" font-family="'PingFang SC', sans-serif" font-size="10" font-weight="600" fill="#64748b">浮点真实物理动作示例：</text>
      <text x="10" y="42" font-family="monospace" font-size="10" fill="#38bdf8">[+0.05, -0.02, +0.10, 0°, ...]</text>
    </g>
  </g>

  <!-- Arrow 1 -> 2 -->
  <g transform="translate(332, 275)">
    <circle cx="10" cy="0" r="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
    <path d="M 7 -4 L 13 0 L 7 4" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Step 2 Card -->
  <g transform="translate(365, 115)" filter="url(#pShadow)">
    <rect width="270" height="320" rx="14" fill="url(#pCard)" stroke="#334155" stroke-width="1.5" />

    <!-- Step Badge -->
    <rect x="20" y="20" width="70" height="26" rx="13" fill="url(#numPurple)" />
    <text x="55" y="37" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">Step 2</text>

    <text x="20" y="78" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="16" font-weight="700" fill="#f8fafc">
      256 格离散化装箱
    </text>
    <text x="20" y="100" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#64748b">
      Quantization into 256 Bins
    </text>

    <!-- Visual binning scale -->
    <g transform="translate(20, 125)">
      <text x="0" y="12" font-family="'PingFang SC', sans-serif" font-size="11" fill="#94a3b8">连续区间 [-1.0m, +1.0m] 等分切块：</text>
      
      <!-- Scale line -->
      <line x1="10" y1="38" x2="220" y2="38" stroke="#475569" stroke-width="3" stroke-linecap="round" />
      
      <!-- Tick 0 -->
      <circle cx="15" cy="38" r="5" fill="#ef4444" />
      <text x="15" y="58" font-family="monospace" font-size="11" font-weight="700" fill="#f87171" text-anchor="middle">0</text>
      <text x="15" y="72" font-family="'PingFang SC', sans-serif" font-size="9" fill="#64748b" text-anchor="middle">最小值</text>

      <!-- Tick 128 -->
      <circle cx="115" cy="38" r="5" fill="#fbbf24" />
      <text x="115" y="58" font-family="monospace" font-size="11" font-weight="700" fill="#fcd34d" text-anchor="middle">128</text>
      <text x="115" y="72" font-family="'PingFang SC', sans-serif" font-size="9" fill="#64748b" text-anchor="middle">中间值</text>

      <!-- Tick 255 -->
      <circle cx="215" cy="38" r="5" fill="#34d399" />
      <text x="215" y="58" font-family="monospace" font-size="11" font-weight="700" fill="#6ee7b7" text-anchor="middle">255</text>
      <text x="215" y="72" font-family="'PingFang SC', sans-serif" font-size="9" fill="#64748b" text-anchor="middle">最大值</text>
    </g>

    <!-- Example box -->
    <g transform="translate(20, 240)">
      <rect width="230" height="60" rx="8" fill="#0b1329" stroke="#1e293b" stroke-width="1" />
      <text x="10" y="20" font-family="'PingFang SC', sans-serif" font-size="10" font-weight="600" fill="#64748b">离散化映射结果（8个整数）：</text>
      <text x="10" y="42" font-family="monospace" font-size="10" fill="#c084fc">[132, 120, 145, 128, 135, ...]</text>
    </g>
  </g>

  <!-- Arrow 2 -> 3 -->
  <g transform="translate(647, 275)">
    <circle cx="10" cy="0" r="14" fill="#1e293b" stroke="#818cf8" stroke-width="1.5" />
    <path d="M 7 -4 L 13 0 L 7 4" fill="none" stroke="#818cf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Step 3 Card (Highlighted) -->
  <g transform="translate(680, 115)" filter="url(#pShadow)">
    <rect width="270" height="320" rx="14" fill="url(#pCardActive)" stroke="#818cf8" stroke-width="2" />

    <!-- Step Badge -->
    <rect x="20" y="20" width="70" height="26" rx="13" fill="url(#numGreen)" />
    <text x="55" y="37" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">Step 3</text>

    <text x="20" y="78" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="16" font-weight="700" fill="#ffffff">
      借用词表 Token
    </text>
    <text x="20" y="100" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#818cf8">
      Reuse Model Vocab Tokens
    </text>

    <g transform="translate(20, 125)">
      <rect width="230" height="52" rx="8" fill="#0f172a" stroke="#6366f1" stroke-width="1" />
      <text x="10" y="20" font-family="'PingFang SC', sans-serif" font-size="10" font-weight="600" fill="#a5b4fc">直接复用词表前 256 个 Token：</text>
      <text x="10" y="38" font-family="'PingFang SC', sans-serif" font-size="10" fill="#cbd5e1">无需新增任何专用的机器人头结构</text>
    </g>

    <g transform="translate(20, 185)">
      <text x="0" y="14" font-family="'PingFang SC', sans-serif" font-size="10" font-weight="600" fill="#94a3b8">标准自回归输出文本字符串：</text>
    </g>

    <!-- Example box Output -->
    <g transform="translate(20, 240)">
      <rect width="230" height="60" rx="8" fill="#052e16" stroke="#10b981" stroke-width="1.2" />
      <text x="10" y="20" font-family="'PingFang SC', sans-serif" font-size="10" font-weight="700" fill="#34d399">大模型最终生成内容（标准文本）：</text>
      <text x="10" y="42" font-family="monospace" font-size="10" font-weight="700" fill="#a7f3d0">"132 120 145 128 135 128 255 0"</text>
    </g>
  </g>
</svg>
