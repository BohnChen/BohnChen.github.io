<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14" />
      <stop offset="50%" stop-color="#0d1527" />
      <stop offset="100%" stop-color="#151b33" />
    </linearGradient>

    <radialGradient id="glowLeft" cx="20%" cy="25%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.32" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowRight" cx="80%" cy="70%" r="55%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowCenter" cx="50%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>

    <!-- Card Backgrounds -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>

    <linearGradient id="cardGradHero" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>

    <!-- Title Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#e0f2fe" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <linearGradient id="vlaGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />
  <rect width="1200" height="630" fill="url(#glowLeft)" />
  <rect width="1200" height="630" fill="url(#glowRight)" />
  <rect width="1200" height="630" fill="url(#glowCenter)" />

  <!-- Grid Pattern -->
  <g stroke="#334155" stroke-opacity="0.22" stroke-width="1">
    <line x1="80" y1="0" x2="80" y2="630" />
    <line x1="1120" y1="0" x2="1120" y2="630" />
    <line x1="0" y1="70" x2="1200" y2="70" />
    <line x1="0" y1="560" x2="1200" y2="560" />
  </g>

  <!-- Top Badges -->
  <g transform="translate(100, 65)">
    <rect width="235" height="34" rx="17" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.6" />
    <circle cx="18" cy="17" r="5" fill="#38bdf8" />
    <text x="32" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" font-size="13" font-weight="600" fill="#38bdf8" letter-spacing="1">具身智能 · 论文精读 ①</text>
  </g>

  <g transform="translate(350, 65)">
    <rect width="195" height="34" rx="17" fill="#1e293b" stroke="#818cf8" stroke-width="1.2" stroke-opacity="0.4" />
    <text x="18" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#c7d2fe">Google DeepMind · 2023</text>
  </g>

  <!-- Main Title -->
  <text x="100" y="152" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" font-size="44" font-weight="800" fill="url(#titleGrad)" letter-spacing="-0.5">
    RT-2：把动作当语言，让大模型操控机械臂
  </text>
  <text x="100" y="198" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" font-size="18" font-weight="400" fill="#94a3b8">
    Vision-Language-Action (VLA) · 互联网通用知识与机器人控制的无缝迁移
  </text>

  <!-- Three Cards (Flow: Vision+Language -> VLA Unified -> Action Tokens) -->

  <!-- Card 1: 输入端 (Vision + Language) -->
  <g transform="translate(100, 245)" filter="url(#shadow)">
    <rect width="300" height="260" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
    
    <rect x="20" y="20" width="38" height="38" rx="8" fill="#0369a1" fill-opacity="0.4" />
    <text x="31" y="45" font-family="sans-serif" font-size="18" fill="#38bdf8">👁️</text>
    <text x="70" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" font-size="17" font-weight="700" fill="#f8fafc">多模态输入</text>
    <text x="20" y="82" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#38bdf8">Vision + Language</text>

    <!-- Content Items -->
    <g transform="translate(20, 110)">
      <rect width="260" height="36" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="14" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" font-size="12" fill="#e2e8f0">📷 场景图像（RGB 照片）</text>
    </g>

    <g transform="translate(20, 155)">
      <rect width="260" height="36" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="14" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" font-size="12" fill="#e2e8f0">💬 “把快过期的水果扔进垃圾桶”</text>
    </g>

    <text x="20" y="222" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" font-size="12" fill="#64748b">
      包含复杂语义推理与常识理解要求
    </text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <g transform="translate(415, 360)">
    <circle cx="10" cy="0" r="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
    <path d="M 6 -5 L 14 0 L 6 5" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Card 2: 核心 VLA 模型 (Highlighted) -->
  <g transform="translate(450, 245)" filter="url(#shadow)">
    <rect width="320" height="260" rx="16" fill="url(#cardGradHero)" stroke="#818cf8" stroke-width="2" />
    
    <rect x="20" y="20" width="38" height="38" rx="8" fill="#4338ca" fill-opacity="0.5" />
    <text x="31" y="45" font-family="sans-serif" font-size="18" fill="#a5b4fc">🧠</text>
    <text x="70" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" font-size="17" font-weight="700" fill="#ffffff">端到端 VLA 模型</text>
    <text x="20" y="82" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="url(#vlaGrad)">PaLI-X / PaLM-E 预训练骨干</text>

    <!-- Key highlight block -->
    <g transform="translate(20, 105)">
      <rect width="280" height="85" rx="10" fill="#0f172a" fill-opacity="0.8" stroke="#6366f1" stroke-width="1" stroke-dasharray="3,3" />
      <text x="15" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" font-size="12" font-weight="600" fill="#c7d2fe">✨ 核心突破：统一词表</text>
      <text x="15" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" font-size="11" fill="#94a3b8">· 互联网海量图文常识无损保留</text>
      <text x="15" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" font-size="11" fill="#94a3b8">· 物理动作直接映射为自然语言 Token</text>
    </g>

    <text x="20" y="222" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" font-size="12" font-weight="600" fill="#a5b4fc">
      不分大脑与小脑，一个模型贯通到底
    </text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <g transform="translate(785, 360)">
    <circle cx="10" cy="0" r="16" fill="#1e293b" stroke="#818cf8" stroke-width="1.5" />
    <path d="M 6 -5 L 14 0 L 6 5" fill="none" stroke="#818cf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Card 3: 输出端 (Action Tokens -> 机械臂控制) -->
  <g transform="translate(820, 245)" filter="url(#shadow)">
    <rect width="280" height="260" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
    
    <rect x="20" y="20" width="38" height="38" rx="8" fill="#047857" fill-opacity="0.4" />
    <text x="31" y="45" font-family="sans-serif" font-size="18" fill="#34d399">🦾</text>
    <text x="70" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" font-size="17" font-weight="700" fill="#f8fafc">动作控制输出</text>
    <text x="20" y="82" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#34d399">8-DoF Action Tokens</text>

    <!-- Output Token sequence -->
    <g transform="translate(20, 105)">
      <rect width="240" height="42" rx="8" fill="#0f172a" stroke="#059669" stroke-width="1" />
      <text x="12" y="26" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" font-weight="700" fill="#34d399">"132 120 145 128 ... 0"</text>
    </g>

    <!-- De-quantization to robot -->
    <g transform="translate(20, 158)">
      <rect width="240" height="42" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="12" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" font-size="11" fill="#cbd5e1">反离散化 ➔ 机械臂 8 维位姿执行</text>
    </g>

    <text x="20" y="222" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" font-size="12" fill="#64748b">
      x, y, z, roll, pitch, yaw, gripper, term
    </text>
  </g>

  <!-- Bottom Quote / Insight Banner -->
  <g transform="translate(100, 525)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', sans-serif" font-size="13" font-weight="500" fill="#64748b">
      💡 核心洞见：把物理世界的连续控制信号“离散化 + 词元化”，让大模型像文字接龙一样顺畅操控现实世界。
    </text>
  </g>
</svg>
