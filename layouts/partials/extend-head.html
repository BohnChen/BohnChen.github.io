<style>
:root {
  --glass-bg: rgba(255,255,255,0.75);
  --glass-bg-dark: rgba(20,20,30,0.80);
}

html, body {
  background: transparent !important;
}
.bg-neutral, .bg-neutral-50, .bg-neutral-100 {
  background-color: transparent !important;
}
.dark .bg-neutral-800, .dark .bg-neutral-900 {
  background-color: transparent !important;
}

/* ═══════════════════════════════════════
   CSS 流动渐变背景（纯 CSS，无 JS 依赖）
   ═══════════════════════════════════════ */
body::before {
  content: "";
  position: fixed;
  top: -50%;
  left: -50%;
  width: 200%;
  height: 200%;
  z-index: -2;
  background:
    radial-gradient(ellipse at 20% 50%, rgba(59,130,246,0.15) 0%, transparent 50%),
    radial-gradient(ellipse at 80% 20%, rgba(99,102,241,0.12) 0%, transparent 50%),
    radial-gradient(ellipse at 40% 80%, rgba(6,182,212,0.10) 0%, transparent 50%),
    radial-gradient(ellipse at 70% 60%, rgba(29,78,216,0.12) 0%, transparent 50%),
    radial-gradient(ellipse at 50% 50%, rgba(59,130,246,0.08) 0%, transparent 70%);
  animation: bgFlow 20s ease-in-out infinite alternate;
}
@keyframes bgFlow {
  0% { transform: translate(0, 0) rotate(0deg); }
  33% { transform: translate(2%, -1%) rotate(1deg); }
  66% { transform: translate(-1%, 2%) rotate(-1deg); }
  100% { transform: translate(0, 0) rotate(0deg); }
}

/* 深色模式 */
.dark body::before {
  background:
    radial-gradient(ellipse at 20% 50%, rgba(59,130,246,0.2) 0%, transparent 50%),
    radial-gradient(ellipse at 80% 20%, rgba(99,102,241,0.18) 0%, transparent 50%),
    radial-gradient(ellipse at 40% 80%, rgba(6,182,212,0.15) 0%, transparent 50%),
    radial-gradient(ellipse at 70% 60%, rgba(29,78,216,0.15) 0%, transparent 50%),
    radial-gradient(ellipse at 50% 50%, rgba(59,130,246,0.10) 0%, transparent 70%);
}

/* ═══════════════════════════════════════
   毛玻璃卡片效果
   ═══════════════════════════════════════ */
main article,
main section,
#home-profile {
  background: var(--glass-bg) !important;
  backdrop-filter: blur(20px) saturate(1.2);
  -webkit-backdrop-filter: blur(20px) saturate(1.2);
  border-radius: 12px;
  margin: 8px 0;
  padding: 16px;
}

footer {
  background: var(--glass-bg) !important;
  backdrop-filter: blur(20px) saturate(1.2);
  -webkit-backdrop-filter: blur(20px) saturate(1.2);
}

header nav {
  backdrop-filter: blur(20px) saturate(1.2);
  -webkit-backdrop-filter: blur(20px) saturate(1.2);
}

.dark main article,
.dark main section,
.dark #home-profile {
  background: var(--glass-bg-dark) !important;
}
.dark footer {
  background: var(--glass-bg-dark) !important;
}
</style>
